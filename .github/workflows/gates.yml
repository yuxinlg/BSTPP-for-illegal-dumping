# Gate execution under D-63.
#
# WHAT RUNS HERE AND WHY IT IS HERE. Every gate whose result does not depend on
# the machine runs on push, and its verdict is THE CHECKED PROCESS'S OWN EXIT
# STATUS as reported by the runner. That is the whole point. Three incidents in
# this repository's own record are cases where the run was right and the report
# was wrong:
#
#   A-25  a collection count measured in a tree holding three untracked files,
#         recorded as evidence about the repository's structure
#   A-47  a wrapper printing EXIT:0 beside "1 failed"
#   A-48  a ruff baseline comparing unlike populations
#
# D-41 clause 4 answers that class by requiring the process's own status. CI
# removes it by construction, because the reporter is not the narrator.
#
# ---------------------------------------------------------------------------
# WHAT DELIBERATELY DOES NOT RUN HERE: THE PIN BATTERY.
#
#   refactor-patches/pin_check_v2.py
#   refactor-patches/pin_compare.py
#   refactor-patches/pin_corpus_identity.py
#
# Golden pins and fixed-seed simulations are MACHINE-LOCAL artifacts (D-27,
# A-11). They must be baselined and compared on the same machine. Empirically
# JAX/XLA traced-path values have matched bit-for-bit across machines here, but
# that is an observation, not a guarantee, and a pin comparison run on a GitHub
# runner against a baseline captured on the development machine would be
# comparing two things nobody has established are comparable -- a green that
# means nothing, or a red that means nothing, and no way to tell which.
#
# So the pin battery is THE ONE DECLARED MANUAL GATE, and this comment is where
# that is recorded. Its absence from this file is a decision, not an oversight;
# D-63 requires the reason to be stated here rather than inferred.
#
# A commit touching production code is not fully gated by a green run of this
# workflow. It needs both pin populations, run locally, both stated in the
# commit body.
# ---------------------------------------------------------------------------
#
# WHERE THE ASCII SWEEP RUNS, AND WHY IT IS NOT ON document-gates (A-59).
#
# Clause evaluation imports bstpp.config, which imports cutoffs (numpyro) and
# polygon_mass (jax). Three alternatives were refused:
#
#   putting jax/numpyro on the document job fights A-55's "seconds, not
#     behind the heavy stack"
#   skipping clause evaluation when the stack is absent is an unreached
#     guard (A-27)
#   thinning config's import graph so CI can import clauses without numpyro
#     is a production change for a CI convenience
#
# So the sweep belongs on the declared conda job. D-63 still holds: the gate
# runs in CI; the pin battery stays the one declared manual gate. The
# captures job records EXIT of the stdlib document gates and must not fail
# the workflow -- document-gates is that verdict, and ASCII is not in that
# loop because a bare-Python capture of it would record the missing stack,
# not the gate.
# ---------------------------------------------------------------------------
#
# WHAT THIS FILE DOES NOT RUN, ON PURPOSE.
#
#   A generated work-package status page. D-53 makes
#   docs/phase3f_completion_manifest.yaml the sole execution authority. A
#   second page restating WP status would be a second owner.
#
#   A placeholder-filling sweep over historical planning files. A-54 left
#   those files historical, with their placeholders unfilled.

name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-gates:
    # The register and documentation gates need the standard library, git, and
    # (for the manifest) PyYAML. They are seconds, so they are not behind the
    # heavy stack. They do not import bstpp. The ASCII sweep is not in this
    # job: clause evaluation needs numpyro/jax (A-59).
    name: register and document gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # _a30_label_check.py reads a pinned baseline commit and
          # _a48_ruff_population.py reads each file's own HEAD version.
          # A shallow clone makes both fail for a reason unrelated to the code.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: hypertarget structural check
        run: python tools/gates/_c1_hypertarget_check.py

      - name: content and decision-monotonicity checks
        run: python tools/gates/_a25_content_checks.py

      - name: label sweep
        run: python tools/gates/_a30_label_check.py

      - name: unreachable-citation sweep
        run: python tools/gates/_a25_citation_sweep.py

      - name: apparatus checks A and B
        run: python tools/gates/_a52_apparatus_checks.py

      - name: install PyYAML at the pinned version
        run: python -m pip install --no-deps PyYAML==6.0.3

      - name: completion manifest parses
        run: |
          python -c "
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('docs/phase3f_completion_manifest.yaml').read_text(encoding='utf-8'))
          wps = data['work_packages']
          assert list(wps) == [f'WP{i}' for i in range(1, 11)], list(wps)
          print('MANIFEST_OK', len(wps), len(data.get('responsibility_coverage', {}).get('items', {})))
          "

      - name: commit-msg hook discriminates
        # The hook is opt-in per clone (`git config core.hooksPath tools/hooks`),
        # so CI cannot assert that any given author has it installed. What it
        # can assert is that the hook still rejects what it must and accepts
        # what it must -- including the API class, whose omission would have
        # rejected a commit the register already classifies SC/API.
        run: sh tools/hooks/test_commit_msg.sh

  lint:
    name: ruff population
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install ruff at the pinned version
        # --no-deps, matching the local convention: ruff is dev tooling and is
        # not part of the runtime pins, so it must not participate in resolution.
        run: python -m pip install --no-deps ruff==0.15.21

      - name: ruff population over the touched Python files
        # Bare ruff is forbidden locally (A-48): it reports a count with no
        # declared population, which is how "13 against 10" came to look like a
        # comparison. The same rule applies here.
        run: |
          set -o pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD^ 2>/dev/null || true)"; fi
          if [ -z "$base" ]; then
            echo "no parent commit; nothing to compare against, population empty"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=d "$base" HEAD -- '*.py' | tr '\n' ' ')"
          if [ -z "$files" ]; then
            echo "no Python files touched; population empty, nothing asserted"
            exit 0
          fi
          echo "declared population: $files"
          python tools/gates/_a48_ruff_population.py $files

  suite:
    name: fast lane
    runs-on: ubuntu-latest
    # The fast lane is the per-commit gate: ~3m45s and 567 tests locally, with
    # 12 slow-marked tests deselected and that deselection visible in its own
    # output. The FULL suite is a series-boundary gate and is run locally --
    # ~28 min, dominated by the 12 slow tests rather than by machine health.
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: illegal-dumping
          auto-activate-base: false

      - name: which interpreter, and is it shadowing the repo
        # A stale bstpp in site-packages shadows the repository for any script
        # whose directory is not the repo root (A-26). pytest is unaffected
        # because it inserts the rootdir first, but the capture should say which
        # object was measured rather than leave it to be assumed.
        shell: bash -el {0}
        run: |
          python -c "import sys, bstpp; print(sys.version); print('bstpp:', bstpp.__file__)"

      - name: ASCII sweep
        # Clause evaluation imports bstpp.config (numpyro via cutoffs, jax via
        # polygon_mass). A-59: this is a package-importing gate, not a stdlib
        # document gate. JAX_PLATFORM_NAME=cpu matches the fast lane.
        shell: bash -el {0}
        env:
          JAX_PLATFORM_NAME: cpu
        run: python tools/gates/_a26_ascii_sweep.py

      - name: fast lane
        shell: bash -el {0}
        env:
          JAX_PLATFORM_NAME: cpu
          MPLBACKEND: Agg
        run: python -m pytest tests/ -q -m "not slow" --durations=10

  captures:
    name: collect gate captures
    runs-on: ubuntu-latest
    needs: [document-gates, lint]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run the document gates into capture files
        # Each capture records the CHECKED PROCESS'S own exit status, never a
        # pipeline's -- `$?` after a `| tail` is tail's (D-41 clause 4). The
        # job does not fail here; document-gates above is the verdict. This
        # exists so the artifacts are readable when something goes red.
        # `set +e` is required: the runner's default is `bash -e`, which
        # aborted the job on the first red gate and contradicted the comment
        # above (A-59). ASCII is not in this loop: a bare-Python capture of
        # it would record the missing stack, not the gate; the suite job is
        # that verdict.
        run: |
          set +e
          mkdir -p ci-captures
          for g in _c1_hypertarget_check _a25_content_checks _a30_label_check \
                   _a25_citation_sweep _a52_apparatus_checks; do
            python "tools/gates/$g.py" > "ci-captures/$g.txt" 2>&1
            echo "GATE $g EXIT:$?" >> ci-captures/summary.txt
          done
          git status --porcelain >> ci-captures/summary.txt
          cat ci-captures/summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gate-captures-${{ github.sha }}
          path: ci-captures/
          retention-days: 30
