schema_version: 1
document_id: phase3f-completion-manifest
title: Phase 3f completion manifest

# ---------------------------------------------------------------------------
# This file is YAML, not register prose. It is deliberately outside the
# populations of the LaTeX/Markdown document gates (anchor census, citation
# sweep, content checks, hypertarget and label checks), whose declared globs
# are phase3_record.tex, docs/*.md and AGENTS.md. A commit that edits only
# this file runs the manifest validator and nothing else.
# ---------------------------------------------------------------------------

as_of:
  date: "2026-08-07"
  branch: refactor
  commit: c4e069fca3018a7471c824d8bb26e25724943a29
  commit_short: c4e069f
  register_tip: A-60 / D-63
  # Evidence baseline (`commit` above) and adoption commit are deliberately
  # distinct fields. `commit` is the tip every claim in this file was verified
  # against and is never rewritten. `adopted_at_commit` names the A-54
  # integration commit, which cannot contain its own hash, so it is filled by
  # the immediate DOC-only follow-up. This sentinel lives for exactly one
  # commit; it is not a fill-anchor of the class the census counts, and this
  # file is in no anchor-census population.
  adopted_at_commit: 6072a194d67f1b45a4fbb4bd122b2badc1e8ca99
  adopted_at_commit_short: 6072a19
  next_free_ids:
    amendment: A-61
    decision: D-64
    config_invariant: CI-11
    open_item: OP-33
  evidence_basis:
    - phase3_record.tex through A-53, decisions D-1 through D-52
    - AGENTS.md at c4e069f
    - production source and tests at c4e069f
    - refactor-patches/phase3f/phase3f_work_package_outline.md (historical)
    - docs/wp_dependency_graph.md (historical)
    - docs/seam_sets.md (historical; see seam_set_disposition below)
    - Phase 3f work-package entry records (historical)

authority:
  role: >-
    Sole source of current Phase 3f execution truth for scope, status,
    dependencies, open decisions, gate applicability, corrective-cycle counts,
    and completion.
  replaces_operational_role_of:
    - docs/wp_dependency_graph.md
    - docs/seam_sets.md
    - refactor-patches/phase3f/phase3f_work_package_outline.md
    - refactor-patches/phase3f/wp2/wp2_opening_conditions_proposal.md
    - refactor-patches/phase3f/wp3_config_objects_entry.md
    - refactor-patches/phase3f/wp4_prepared_data_entry.md
    - refactor-patches/phase3f/wp5_excitation_support_entry.md
    - refactor-patches/phase3f/wp6_mutators_membership_entry.md
    - refactor-patches/phase3f/wp7_decoder_contract_entry.md
    - refactor-patches/phase3f/wp8_input_metadata_entry.md
    - refactor-patches/phase3f/wp9_results_io_entry.md
    - refactor-patches/phase3f/wp10_args_removal_entry.md
  does_not_replace:
    phase3_record: >-
      The append-only scientific and historical authority, including all
      settled model semantics, change classifications, and amendments.
    tests_and_evidence: >-
      Executable gates and committed captures remain evidence. The manifest
      reports their applicability and state; it does not substitute for them.
  historical_documents_rule: >-
    Superseded planning files remain unchanged except for a short supersession
    banner. They are evidence of what was known and decided when written, not
    current task trackers. Their placeholders are not filled and their old
    measurements are not repaired.
  update_rule: >-
    Any commit that changes a Phase 3f deliverable's status, scope,
    dependency, blocker, corrective-cycle count, or exit gate updates this
    manifest in the same commit. Commit count and WPn.m labels never determine
    progress.

status_vocabulary:
  not_started: No production deliverable for the declared scope exists.
  partial: Some production foundation exists, but at least one required exit
    condition is unsatisfied.
  complete: Every listed exit condition is satisfied by named evidence.
  blocked: Work cannot proceed without a recorded external/user decision.
  deferred: Explicitly outside Phase 3 and assigned to a later phase or project.
  historical: Retained as evidence but not part of current completion state.

# ---------------------------------------------------------------------------
# Settled decisions carried by the adopting amendment.
# ---------------------------------------------------------------------------

settled_decisions:

  standardization:
    open_item: OP-28
    state: closed
    accepted_values: [null, domain_area]
    default: null
    booleans: rejected
    already_implemented: true
    implementation_evidence:
      - bstpp/config.py validate_standardize_cov accepts only None and
        'domain_area'
      - bstpp/preparation.py attach_covariate_partitions weights each row by
        the area of its clipped support C_c intersect A, keeping zero-area rows
        at zero weight
    domain_area_semantics: >-
      Area-weight each covariate row by its exact clipped domain mass
      |C_c intersection A|. Zero-area rows have zero influence.
    cross_site_rule: >-
      In-package domain_area standardization is a single-fitted-domain
      convenience. Analyses comparing coefficients across districts, parks,
      sites, or time periods standardize once against an external fixed
      reference distribution and pass standardize_cov=None.
    comparability: >-
      Results produced with legacy standardize_cov=True and results produced
      with standardize_cov='domain_area' are not comparable and are never
      relabeled as though they used the same estimator.
    consequence: >-
      G-B is closed. The bind-time relocation of standardize_cov is BP for the
      accepted path.

  seam_set_disposition:
    state: retired_as_opening_precondition
    replaced_by: the per-work-package `scope` field in this manifest
    reason: >-
      The declared seam set existed to supply a denominator for the pin
      reachability ratio. With that ratio retired as an opening precondition,
      the seam set's only remaining function is scope declaration, which the
      `scope` and `completion_owner_for` fields below perform directly. Moving
      one artifact's job into a file that already exists removes an artifact
      rather than relocating it.
    enumerated_reach: [WP1, WP3, WP4, WP5, WP6, WP7, WP8, WP9, WP10]
    wp2_note: >-
      WP2's seam set was declared retroactively and remains valid; nothing
      about it is reopened.
    docs_seam_sets_md: historical

  pin_reachability:
    state: retired_as_opening_precondition
    retained_as: optional diagnostic at a fixed tree
    coverage_discipline_survives_in:
      - pin_compare verdict lines carrying compared=n/m with candidate_only and
        baseline_only populations
      - the touched-file ruff population instrument
      - the capture population instrument
    reason: >-
      A gate must still declare its coverage before it is read as evidence.
      That principle is now mechanized in the instruments that print their own
      populations, which is cheaper and harder to get wrong than a hand-derived
      statement-count ratio that is only comparable within a fixed tree.

  corrective_depth:
    cap: 3
    unit: work_package
    counted: corrective cycles
    not_counted:
      - planned commits
      - documentation updates
      - RED-to-GREEN completion of the same declared change
      - WPn.m label increments
    definition: >-
      A corrective cycle is a landed production implementation that must be
      repaired because its own declared exit gate fails.
    on_third: >-
      Record the failed assumption, split or narrow the work package, and take
      a decision. Do not respond with a fourth general audit.
    wp2_grandfathering: >-
      WP2 carries labels WP2.3 through WP2.8. The label sequence is not a cycle
      count and reconstructing the cycle count from it would require re-reading
      a settled history. WP2 is grandfathered with the ambiguity recorded, and
      its counter below starts at 0 from the adopting amendment forward.

  wp8_ownership:
    class: BP
    constructor_api: preserved
    spatial_cov_crs_owner: ModelData
    data_contracts_owner: InferenceRunConfig
    compatibility_rule: >-
      Existing constructor keywords remain accepted and are adapters into the
      typed owners. Their accepted values and behavior do not change in WP8.

  decoder_identity:
    packaged_artifacts: verified_sha256
    custom_decoders: declared_decoder_id
    path_is_identity: false
    unknown_provenance: allowed_and_preserved
    contract: docs/decoder_contract.md
    artifacts_under_contract:
      temporal: bstpp/decoders/decoder_1d_T50_fixed_ls
      seasonal: bstpp/decoders/decoder_1d_T24_circ_small_l8
      spatial: bstpp/decoders/2d_decoder_15_5_large.pkl
    artifacts_not_under_contract: >-
      The six remaining files under bstpp/decoders/ are unreferenced by
      production code. They are out of contract; WP7 neither hashes nor
      validates them and does not delete them.

  results_format:
    format: versioned_pickle_envelope
    schema_version: 1
    args_independent: true
    wp10_may_change_schema: false
    contract: docs/results_format.md
    g2_test_note: >-
      The existing strict xfail asserts a top-level 'cutoff_provenance' key.
      Schema v1 stores cutoff provenance at excitation.cutoffs, so implementing
      the schema alone leaves the xfail xfailing and the gate cannot detect its
      own satisfaction. The WP9 commit rewrites the assertion path and
      preserves the pre-rewrite xfail as the RED capture.

  unsupported_historical_consumer:
    name: bstpp.cox_hawkes_shared.Cox_Hawkes_Shared
    state: excluded
    reason: >-
      It was discovered only through an old analysis file, is absent from the
      tracked package, and is not used by the cbg-park-seasonal analysis that
      Phase 3 targets. It may describe a feature that was later deleted.
    obligations:
      audit: false
      migrate: false
      preserve_compatibility: false
      block_wp2_or_wp10: false

  orphaned_op23:
    state: reserved_absent_and_nonblocking
    finding: >-
      The descriptive phrase is already absent from AGENTS.md at c4e069f. It
      survives only inside the register's own quotation of it, which is a
      record of what was cited and is not edited.
    action: >-
      Record OP-23 as nonblocking. Invent no content and do not reissue the
      number. No AGENTS.md edit is required for this item.

  historical_document_gate_gap:
    name: G-A
    state: historical_nonblocking_tooling_debt
    action: >-
      Do not manufacture further capability captures solely to close the old
      census. Run document gates only when their input surface changes.

  public_class_surface:
    classes: [Hawkes_Model, LGCP_Model]
    configurations: [plain_hawkes, cox_hawkes, lgcp]
    note: >-
      Cox-Hawkes is Hawkes_Model(cox_background=True), not a third class.
      Deliverables and smoke gates say two classes and three configurations.

# ---------------------------------------------------------------------------
# Execution.
# ---------------------------------------------------------------------------

execution:
  protocol: docs/phase3f_execution_protocol.md
  tracking_unit: deliverable
  implementation_shape: vertical_slices
  indicative_commit_budget: 12 to 18 production commits across S1 to S4
  amendment_budget: at most one register amendment per slice, for decisions,
    classifications, and corrections only
  stop_rule: >-
    Phase 3f stops when every required deliverable below is complete, every
    blocker is closed or explicitly deferred under this manifest, and every
    applicable exit gate passes. The absence of findings on another general
    audit pass is not a completion criterion.

milestones:
  analysis_resumption_point:
    at: S3 boundary
    status: not_reached
    meaning: >-
      The commit at which downstream analysis may resume against the package.
      At this point the five typed configs exist, runtime ownership is
      consolidated, the decoder contract validates before inference, and
      results schema v1 records the fitted problem. The public API has been
      stable throughout.
    required:
      - S1, S2, and S3 exit gates pass at one named commit.
      - Fast and slow lanes pass as separate invocations in the pinned
        environment.
      - Canonical 2026-07 pins report zero diffs over their four shared
        configurations, with the comparison population printed.
      - Forward 2026-08 polygon pins report six-of-six MATCH.
      - End-to-end fit and simulation smoke runs pass for plain Hawkes,
        cox_hawkes, and LGCP.
      - Results schema v1 and decoder-contract negative tests pass.
    not_required:
      - self.args removal
      - plotting delegation
      - thin model-family wrappers
    rationale: >-
      S4 is internal hygiene behind an unchanged public surface. Holding the
      analysis until S4 lands couples a downstream schedule to work that cannot
      change a downstream result.
  phase3f_exit:
    at: S4 boundary
    status: not_reached

vertical_slices:

  S0_operational_reset:
    status: complete
    completed_at: 6072a19
    status_note: >-
      Closed at S1.1. The value was `in_progress`, which is not in this file's
      own status_vocabulary; closing the slice removes the non-conforming value
      without needing an erratum, because every exit-gate item below was
      already satisfied by named evidence and none of it was re-derived here.
    exit_evidence:
      documents_agree: >-
        A-54 landed the manifest, the execution protocol, the decoder contract
        and the results-format contract at 6072a19, with the adoption commit
        recorded by the immediate DOC follow-up 29efe7c.
      yaml_and_coverage: >-
        MANIFEST_OK 10 17 -- WP1-WP10 all present, and all 17 section 10.f
        responsibilities map to exactly one completion owner. Re-read at S1.0
        (results/_a55_s1_0_manifest_validate.txt) and again at S1.1.
      document_gates: >-
        Passed over their declared populations at 6072a19. NOT a stale
        citation: the populations are phase3_record.tex, docs/*.md and
        AGENTS.md, and `git log 6072a19..HEAD -- phase3_record.tex docs/*.md
        AGENTS.md` is EMPTY, so no input to those gates has moved since they
        last ran green. They are re-run at S1.5, where the populations change
        for the first time in this slice.
      no_production_change: >-
        `git diff c4e069f..abe0f8b -- bstpp/ tests/` was empty at the S1.0
        precondition check, so S0 changed no file under bstpp/ or tests/.
    work_packages: []
    deliverables:
      - Install this manifest, the execution protocol, the decoder contract,
        the results-format contract, and the adopting amendment.
      - Mark older planning documents as historical/supporting.
      - Replace the mutable Phase 3f status block in AGENTS.md with a concise
        pointer to this manifest and immutable technical cautions.
    exit_gate:
      - Documents agree on authority, decisions, IDs, and source commit.
      - YAML parses; every work package WP1-WP10 is present; every original
        section 10.f responsibility maps to exactly one completion owner.
      - Register structure, label, citation, hypertarget, and anchor checks
        pass over their declared populations.
      - No file under bstpp/ or tests/ changed.

  S1_configuration_spine:
    status: in_progress
    opened_at: S1.0
    closes_under_amendment: A-61
    work_packages: [WP2, WP1, WP3]
    scope_declared: true

    # ---- protocol section 4 slice brief ----------------------------------

    deliverables:
      - ModelConfig, frozen, one factory, CI-7/CI-9/CI-10 relocated into
        __post_init__ without clause-text or exception-identity change. Owner
        WP2.
      - PriorConfig, frozen, one factory, owning a_0/alpha/beta/sigmax_2 and the
        w prior, with sigmax_2 truncation provenance. Owner WP2.
      - NumericalConfig's unresolved panel_h_m sentinel and the config bind API
        that resolves it, with the cutoff-tolerance construction sites routed
        through the bound instance. Owner WP1.
      - PartitionDecoderConfig and InferenceRunConfig, frozen, one factory each.
        Owner WP3.
      - A deterministic to_record() on all five config objects, including
        NumericalConfig, which has none at the slice baseline.
      - One declared keyword-to-owner registry in bstpp/config.py, replacing
        per-call-site shims. This table is what WP10 deletes.

    production_files_expected_to_change:
      - bstpp/config.py
      - bstpp/main.py
      - bstpp/cutoffs.py
      - bstpp/inference_functions.py
    production_files_not_expected_to_change:
      - bstpp/polygon_mass.py
      - bstpp/preparation.py
      - bstpp/excitation_support.py
      - bstpp/likelihood.py
      - bstpp/decode_fields.py
      - bstpp/data_contracts.py
      - bstpp/trigger.py
      - bstpp/utils.py
      - bstpp/vae_functions.py
    new_test_files:
      - tests/test_model_config.py
      - tests/test_config_bind.py
      - tests/test_prior_config.py
      - tests/test_wp3_configs.py
    existing_tests_edited: none
    existing_test_edit_rule: >-
      No planned test edit is named for any S1 commit. Protocol section 5.3
      permits a planned edit only when the slice brief names it and it is signed
      off. An existing row that must change is therefore evidence the accept set
      moved: stop and report rather than editing.

    public_behavior_expected_to_remain_stable:
      - Public constructor signatures of Hawkes_Model, LGCP_Model and
        Point_Process_Model.
      - The accept set of every constructor argument, in both directions.
      - run_svi(num_steps, lr, ...) and run_mcmc(...) keyword interfaces; lr
        stays a required positional.
      - Every args key these quantities feed, written exactly as now, including
        args['sp_var_mu'], args['model'], args['priors'] and
        self.standardization.
      - Sampled-site and deterministic-site names.
      - Canonical clause text and exception identity at every relocated site.
    declared_behavior_or_api_change: >-
      Every S1 production commit is BP, with S1.2 additionally carrying IV for
      the panel_h_m sentinel. The one API change this slice identified is
      routed out of it: see WP9's intake block. One exception-ORDERING change
      is declared at S1.1 and recorded below; no accept set moves anywhere in
      the slice.
    declared_ordering_change_s1_1:
      what: >-
        CI-7's sp_var_mu check moves from main.py:564 to ModelConfig's
        __post_init__, constructed at main.py:333's position. The covariate leg
        (main.py:440-520) runs between those two points, so sp_var_mu now
        precedes it. A caller passing BOTH an invalid sp_var_mu and invalid
        covariates previously saw DataContractError and now sees the CI-7
        clause.
      why_it_is_still_BP: >-
        No argument's accept set moves in either direction. Every value either
        tree rejects is still rejected, through the same canonical clause and
        the same NumericalConfigError identity; every value either tree accepts
        is still accepted. Only which of two simultaneous errors surfaces
        first changes. The ordering among the three relocated clauses
        themselves -- CI-10, then CI-9, then CI-7 -- is preserved exactly, and
        the data-contract leg still precedes all three.
      why_it_is_unavoidable_at_this_position: >-
        The three clauses must live in one __post_init__ in their firing
        order. main.py:333 is the earliest of the two base-class positions, so
        it is the only one that keeps CI-9 unconditional and ahead of the
        covariate leg, which is the property A-45 landed CI-9 for.
      measured_before_the_change: >-
        refactor-patches/captures/a55_s1_1_pre_change_order.log, final block.
      pinned_after_the_change: >-
        tests/test_model_config.py::
        test_sp_var_mu_now_precedes_the_covariate_leg_A_DECLARED_ORDER_CHANGE

    tests_characterizing_pre_change_behavior:
      - The existing fast lane at the slice baseline, run before each commit's
        edit, as the accept-set reference.
      - Per commit, a RED capture taken against HEAD before bstpp/ is touched,
        preserved under refactor-patches/captures/ (D-45/D-46).
      - S1.1 specifically captures pre-change two-invalid-argument exception
        ordering from HEAD before editing, because the relocation must reproduce
        the order main.py:2027 -> :333 -> :564 fires today.
    targeted_negative_tests_for_new_validation:
      - Each relocated invariant rejects, asserting on the canonical clause text
        rendered by the shared clause function and, in addition, on the
        exception type. Never the type instead of the text (A-26).
      - Ordering rows for (cox_background bad, standardize_cov bad) and
        (standardize_cov bad, sp_var_mu bad).
      - Accept-set rows in both directions -- nothing previously rejected is now
        accepted, nothing previously accepted is now rejected.
      - Reading an unresolved sentinel field raises a named clause.
      - The panel ratio prefilter still fires on the same inputs with the same
        clause.
      - Frozen -- mutation raises FrozenInstanceError on every config object.
      - to_record() is byte-stable across two constructions of the same
        configuration.

    order:
      - S1.0 open the slice (this commit)
      - S1.1 ModelConfig, to_record, adapter, keyword registry
      - S1.2 bind API and the panel_h_m sentinel
      - S1.3 PriorConfig
      - S1.4 PartitionDecoderConfig and InferenceRunConfig
      - S1.5 slice boundary
    order_note: >-
      This is a within-slice reordering of the protocol section 9 list and of
      planned_commit_boundaries below. It is not a scope change: the same
      deliverables land, in the same slice, under the same exit gate. The bind
      API moves ahead of PriorConfig because two PriorConfig fields are
      ModelData-dependent and need exactly the machinery panel_h_m needs. The w
      prior's support dimension comes from num_cov (main.py:546, from
      main.py:507) and the sigmax_2 truncation comes from resolve_sigma_bounds
      with the prepared domain CRS (main.py:2100-2102). Building the bind
      machinery once and consuming it twice is cheaper than generalising an
      ad-hoc resolution one commit later, and it keeps the sentinel discipline
      in protocol section 5.1 single-sourced. WP1's depends_on [WP2] still
      holds, because ModelConfig lands at S1.1, before the bind API at S1.2.
    planned_commit_boundaries:
      superseded_by: order
      note: >-
        Retained as the boundary list declared when the slice was planned. The
        executed order is `order` above. Both describe the same deliverables.
      list:
        - ModelConfig frozen dataclass and factory, constructor kept as adapter.
        - PriorConfig frozen dataclass and factory, constructor kept as adapter.
        - NumericalConfig unresolved-metric sentinel plus bind-time resolution
          from ModelData/PreparedDomain CRS.
        - Cutoff-tolerance construction sites routed through the bound instance.
        - PartitionDecoderConfig and InferenceRunConfig with factories and
          deterministic to_record snapshots.
        - Slice boundary rebaseline record.

    decisions:
      # Protocol section 4: all decisions the slice needs, raised together,
      # before production work. None of these takes a new D- number; each is an
      # application of a settled decision to this slice.
      model_config_construction_site:
        decision: >-
          ModelConfig is constructed inside Point_Process_Model.__init__.
          Hawkes_Model keeps its validate_cox_background call at main.py:2027.
          Two sites, one clause, rendered byte-for-byte.
        basis: D-40, and the A-45 precedent that did exactly this for
          standardize_cov.
        why_the_second_site_stays: >-
          It fires before expensive base construction, so the argument the
          caller passed is still the object being checked, and Hawkes_Model
          derives its family name from cox_background at main.py:2029-2032,
          before super() at main.py:2058 is reached.
      bind_api_precedes_prior_config:
        decision: The bind API lands at S1.2, before PriorConfig at S1.3.
        basis: order_note above.
      bare_exception_at_main_569:
        decision: >-
          main.py:569 raises a bare Exception on the unknown-prior-kwarg path.
          The exception type is a public failure mode, so changing it is an API
          change. It is routed to WP9 intake and is NOT fixed in S1. The line
          moves verbatim into PriorConfig at S1.3, type included.
        note: >-
          AGENTS.md's general prohibition on bare exception raising, read
          literally, calls for fixing it here. Protocol section 5.4 and the S1
          BP classification win: a slice declared behaviour-preserving does not
          change a public failure mode in passing.
        routed_to: WP9
      s1_closes_under_a61:
        decision: >-
          S1 closes under amendment A-61, which also registers the four
          post-A-54 remediation commits (1da6a60, 1b42897, c04c989, a72f5f4).
          Their nine _a55_ gate outputs, and S1.0/S1.1's _a55_s1_* outputs and
          captures, keep their names and belong to A-61. S1 outputs written
          from here on use the _a61_ prefix.
        basis: >-
          Protocol section 6.1 makes the gate-output prefix the amendment
          number. This decision was first recorded at S1.0 as
          s1_closes_under_a55, when A-55 was next free. A-55..A-60 and D-63 were
          then published on origin/refactor (0327b41..b44795b) from a divergent
          copy of the repository, and none of them registers the four
          remediation commits or any _a55_ artifact. S1.0/S1.1 were rebased onto
          them, so S1 takes the next free number. Renaming committed evidence
          to match is rejected for the reason the original decision gave, so
          the _a55_ prefix is an exception to section 6.1 stated here rather
          than corrected in the files: _a55_ outputs written before 0327b41
          belong to A-61, never to A-55. The remediation commits' detail is in
          refactor-patches/phase3f/rebaseline_record_a54.md sections 11-13 and
          is cited by A-61, not restated. Divergence record:
          refactor-patches/box_salvage_2026-10-08.md.
        next_free_after_a61: {amendment: A-62, decision: D-64,
          config_invariant: CI-11, open_item: OP-33}

    pin_reachability:
      # Qualitative, per protocol section 4. No ratio is recorded.
      harness: refactor-patches/pin_check_v2.py
      configurations: [hawkes, cox_hawkes, lgcp, hawkes_nonsquare_4to1,
        hawkes_notched_4to1_polygon_mode, hawkes_notched_4to1_rectangle_mode]
      model_config:
        cox_background: >-
          Reached by all six. Configurations 1, 4, 5 and 6 pass False and
          configuration 2 passes True explicitly; configuration 3 is LGCP, where
          the field is None by construction and the None-skip branch is the
          reached path.
        sp_var_mu: >-
          Reached by all six, at its 2.0 default. No pin overrides it, so the
          pins gate the default path and not the accept set.
        standardize_cov: >-
          Reached by none. No pinned configuration supplies covariates or a
          standardization method, so the pins carry no evidence about this
          quantity and the targeted rows in tests/test_model_config.py are its
          only instrument.
      prior_config: >-
        Reached by all six. Configurations 1, 2, 4, 5 and 6 pass a_0, alpha,
        beta and sigmax_2 as constructor kwargs (pin_check_v2.py:100-101, :121,
        :126, :149, :224-227); configuration 3 passes a_0 (:131). Configurations
        5 and 6 additionally exercise sigmax_2 truncation against resolved sigma
        bounds on a polygon domain (min_sigma=0.05, max_sigma=0.5). This makes
        S1.3 genuinely pin-reachable.
      panel_h_m: >-
        Reached only by configurations 5 and 6, which pass POLY_PANEL_H = 0.4
        explicitly (pin_check_v2.py:174, :206) because the shipped 20 m default
        is ~20x this domain and the panel ratio guard would reject it. The
        2026-08 forward baseline is therefore the ONLY verdict that gates this
        quantity; the canonical 2026-07 baseline does not contain those two
        records.
      wp3_quantities: >-
        Reached by no pin. The harness traces the model directly rather than
        running inference, so no pin observes run hyperparameters, RNG
        provenance or decoder-contract references. Targeted tests carry that
        surface entirely.

    boundary_gates:
      - Fast and slow lanes as separate processes, stating that the two lanes
        partition the suite exactly.
      - Canonical 2026-07 pin comparison, stating its four-of-six shared
        population; PARTIAL is not a failure.
      - Forward 2026-08 polygon pin comparison, requiring six-of-six MATCH.
      - refactor-patches/pin_corpus_identity.py.
      - End-to-end family smokes for plain Hawkes, cox_hawkes and LGCP.
      - results/_a26_ascii_sweep.py, stating its coverage fraction.
      - results/_a48_ruff_population.py over the touched-file population.
      - Document gates, whose populations change for the first time in this
        slice at S1.5 -- results/_a25_content_checks.py, the hypertarget
        structural check, the citation sweep and the label sweep.
      - The manifest validator.
    per_commit_gate_note: >-
      Protocol section 6.1 applies per production commit: targeted tests, the
      fast lane, the touched-file ruff population, the ASCII sweep, both pin
      populations, and the section 6.3 escalations that actually fire. Document
      gates do not run before S1.5 because no file in their declared population
      (phase3_record.tex, docs/*.md, AGENTS.md) changes before it.
    exclusions:
      - SBC, for the whole slice. Protocol section 6.7 assigns the Cox-Hawkes
        Stage 3 R=200 run to Phase 3g as a parallel exit track; it is not a
        per-commit or per-slice gate and no S1 commit reruns it.
      - Decoder contract validation. WP7, S3. S1.4 gives the contract a typed
        place to live and validates nothing.
      - Results schema v1 implementation. WP9, S3. S1 designs to_record for it
        and does not write the envelope.
      - Removal of args as canonical state. WP10, S4. S1 keeps every args key.
      - Any repair of the bare Exception at main.py:569. See
        decisions.bare_exception_at_main_569.
    non_goals:
      - No new D-, OP- or CI- number. If one looks necessary, stop and report.
      - No renaming of any public symbol.
      - No new exception class per config object; the CI-n sequence and the
        existing require_config_* helpers are reused.
      - No abstraction for city scale, multiresolution, reporting regions or
        computation partitions.
      - No general audit pass, and no new audit apparatus.
      - No edit to phase3_record.tex or AGENTS.md before S1.5.

    exit_gate:
      - All five frozen config objects exist and validate their own invariants
        in __post_init__.
      - Every accepted constructor and run argument has exactly one typed
        canonical owner.
      - Each config exposes a deterministic to_record() suitable for schema v1.
      - Valid legacy calls preserve traces and both pin baselines; declared
        rejected inputs fail through their canonical CI-n clause identities.
      - No config object reads ModelData; data-dependent fields hold an
        explicit sentinel until bind.

  S2_runtime_ownership:
    status: not_started
    work_packages: [WP4, WP5, WP6]
    scope_declared: false
    order:
      - Make prepared objects the runtime owners of data, geometry, partitions,
        maps, refinements, areas, and W.
      - Consolidate excitation support, mass-table, cutoff, and provenance
        ownership against the resolved config objects.
      - Make public mutation transactional over typed canonical state and
        single-source membership through PreparedDomain.covers_xy.
    exit_gate:
      - Runtime consumers read canonical typed/prepared state rather than
        duplicated args entries.
      - Simulator and likelihood consume the same support, mass, and cutoff
        atoms.
      - set_window remains sentinel-aware and transactional on all three
        overrides, and LGCP continues to reject every form with one clause.

  S3_artifacts_and_interfaces:
    status: not_started
    work_packages: [WP7, WP8, WP9]
    scope_declared: false
    order:
      - Implement decoder contracts and identities for the three artifacts
        under contract.
      - Move input metadata to typed owners behind stable constructor adapters.
      - Implement results schema v1, rewrite the G2 assertion path, and turn
        the strict xfail into a passing test.
    exit_gate:
      - Decoder role, shape, partition, flattening, and gain mismatches fail
        before inference.
      - UNKNOWN training provenance remains explicit and survives round trip.
      - Results round-trip configs, data identity, decoder identity, and
        excitation/cutoff provenance without serializing args.
      - Incompatible result attachment fails before model mutation.
      - The analysis resumption point conditions are satisfied at this commit.

  S4_architectural_cutover:
    status: not_started
    work_packages: [WP10]
    scope_declared: false
    order:
      - Delegate plotting while preserving the nine model.plot_* methods.
      - Reduce the two public model classes to thin wrappers over shared
        orchestration.
      - Make inference and simulation consume typed state directly.
      - Remove args as canonical state, then remove the adapter.
    exit_gate:
      - No production code reads or writes self.args or accepts an args dict as
        canonical runtime state.
      - Public sampled-site and deterministic-site names are unchanged.
      - Plotting, fitting, scoring, simulation, save/load, and mutation work
        through the thin wrappers.
      - All Phase 3f exit gates pass.

# ---------------------------------------------------------------------------
# Work packages. `scope` replaces the retired seam-set artifact. Packages whose
# slice has not opened declare scope in the commit that opens the slice.
# ---------------------------------------------------------------------------

work_packages:

  WP1:
    name: NumericalConfig
    class: BP_with_declared_SC_at_bind_time
    slice: S1_configuration_spine
    status: partial
    corrective_cycles_used: 0
    scope:
      declared: true
      files: [bstpp/config.py, bstpp/polygon_mass.py, bstpp/cutoffs.py,
        bstpp/main.py]
      files_note: >-
        bstpp/main.py was added at the S1 opening commit. It was absent from the
        original declaration while carrying every one of WP1's four
        NumericalConfig.create sites (main.py:2108 polygon, :2116 rectangle,
        :2346 set_window, :2926 LGCP) and both cutoff-tolerance construction
        sites (main.py:2145-2158 constructor, :2352-2353 set_window). All three
        of WP1's `remaining` items edit that file, so the omission would have
        made the declared scope disagree with the declared remaining work. The
        tree is the authority; the manifest was corrected to match it.
      quantities:
        - resolved sigma bounds and budget policy
        - panel_h_m and the mass-table builder settings
        - cutoff tolerance precedence and design scales
    completed:
      - Frozen NumericalConfig exists behind the args adapter.
      - Object invariants, canonical clauses, and a single factory exist.
      - Resolved sigma bounds and budget policy are represented.
    remaining:
      - Represent unresolved metric panel_h_m with an explicit bind-time
        sentinel rather than the module default DEFAULT_PANEL_H_M = 20.0, which
        is silently wrong by orders of magnitude for CRS-less domains.
      - Resolve metric defaults from ModelData/PreparedDomain CRS only at bind.
      - Route cutoff tolerance construction sites through the bound instance.
    depends_on: [WP2]
    completion_owner_for:
      - numerical configuration

  WP2:
    name: ModelConfig and PriorConfig
    class: BP_except_predeclared_API_or_SC_validation_changes
    slice: S1_configuration_spine
    status: partial
    corrective_cycles_used: 0
    progress_note: >-
      CI-9, CI-10, and CI-7 at the sp_var_mu site have landed as enforcement at
      pre-object sites. Neither named config class exists at c4e069f. The
      deliverable is the two classes; enforcement commits are not deliverable
      completion.
    scope:
      declared: true
      files: [bstpp/config.py, bstpp/main.py]
      model_config_owns:
        - model family and cox_background mode
        - sp_var_mu value
        - standardize_cov policy
        - model-level trigger/support selections not owned by WP5 runtime
          objects
      prior_config_owns:
        - a_0 prior
        - w prior when covariates are present
        - alpha prior
        - beta prior
        - sigmax_2 prior and its resolved truncation provenance
    remaining:
      - Implement both frozen dataclasses with one factory each.
      - Move canonical ownership from constructor locals and kwargs into them.
      - Relocate the already-landed CI-7, CI-9, and CI-10 enforcement into
        __post_init__ without changing clause text or exception identity.
      - Preserve the legacy constructor as an adapter.
    depends_on: []
    completion_owner_for:
      - frozen typed model configuration
      - separate prior configuration

  WP3:
    name: PartitionDecoderConfig and InferenceRunConfig
    class: BP
    slice: S1_configuration_spine
    status: not_started
    corrective_cycles_used: 0
    scope:
      declared: true
      files: [bstpp/config.py, bstpp/main.py, bstpp/inference_functions.py]
