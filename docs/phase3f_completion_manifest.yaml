    depends_on: [WP3, WP4]
    completion_owner_for:
      - input metadata and enforcement-policy ownership

  WP9:
    name: Results I/O and provenance
    class: API
    slice: S3_artifacts_and_interfaces
    status: not_started
    corrective_cycles_used: 0
    scope:
      declared: false
      declare_at: S3 opening commit
      expected_files: [bstpp/main.py, bstpp/config.py,
        tests/test_lane_b_config_matrix.py]
    completed:
      - A strict xfail names the missing G2 provenance round trip.
    remaining:
      - Implement docs/results_format.md schema v1.
      - Save versioned typed snapshots and provenance without args.
      - Validate compatibility before mutating an existing model.
      - Rewrite the G2 assertion from the top-level cutoff_provenance key to
        excitation.cutoffs, preserving the pre-rewrite xfail as the RED
        capture, and land it as a passing test.
    depends_on: [WP2, WP3, WP7, WP8]
    completion_owner_for:
      - versioned results persistence

  WP10:
    name: Architectural cutover and args removal
    class: BP_with_preserved_public_adapters
    slice: S4_architectural_cutover
    status: not_started
    corrective_cycles_used: 0
    intake_freeze: c4e069fca3018a7471c824d8bb26e25724943a29
    scope:
      declared: false
      declare_at: S4 opening commit
    remaining:
      - Remove self.args as canonical internal state; 176 references exist at
        c4e069f, all in bstpp/main.py.
      - Remove args-dict inputs from inference and simulation internals.
