# Conda environment for BSTPP development and gate execution.
#
#   conda env create -f environment.yml
#   conda activate illegal-dumping
#
# SCOPE. This file reproduces the DEVELOPMENT environment: the runtime stack
# plus the geometry stack, pytest, and ruff. The package's own runtime pins
# live in requirements-runtime.txt and are consumed through pyproject.toml's
# dynamic dependencies; this file does not replace them, and the two must not
# drift.
#
# VERSIONS ARE THE MEASURED ONES, not a wish list. Every pin below was read from
# the working environment with importlib.metadata (recorded 2026-09-15), so a
# mismatch between this file and a fresh environment is a real difference rather
# than a transcription error.
#
# THE PIN CHAIN IS ONE-DIRECTIONAL AND FRAGILE. Do not bump casually:
#
#   jax==0.4.23  ->  numpy<2   (jax 0.4.23 targets the numpy 1.x ABI; np.trapz
#                               was removed in numpy 2.0)
#   numpy<2      ->  scipy<1.13
#   numpy<2      ->  rasterio  (rasterio>=1.5 requires numpy>=2)
#
#   geopandas>=1.0 is REQUIRED, not preferred: _sim_cox passes rng= to
#   GeoSeries.sample_points, which only geopandas 1.0+ accepts.
#
# THE GEOMETRY STACK IS PART OF THE REPRODUCIBILITY CONTRACT, not incidental.
# GeoSeries.sample_points internals are geopandas-version-sensitive, so
# geopandas / shapely / GEOS belong alongside the jax and numpy pins whenever
# cross-session reproducibility of simulations matters.
#
# GOLDEN PINS ARE STILL MACHINE-LOCAL. This file makes the software stack
# reproducible; it does not make pin_check_v2.py output portable. Always
# baseline and compare pins on the same machine (D-27 / A-11).
#
# rasterio is MEASURED at 1.4.4. A-57 closed the A-55 disagreement by widening
# requirements.txt to rasterio<1.5, matching the constraint this comment always
# stated (1.5 is the version that requires numpy>=2). 1.4.4 is still the
# measured pin here; the extra is not frozen to a patch this checkout happened
# to have.

name: illegal-dumping

channels:
  - conda-forge

dependencies:
  - python=3.12.13

  # Geometry stack: from conda-forge so GEOS and PROJ are the packaged builds
  # rather than whatever wheels happen to resolve.
  - geopandas=1.1.3
  - shapely=2.1.2
  - pyproj=3.7.2

  - pip

  - pip:
      # --- numerical core: the pin chain above ---
      - jax==0.4.23
      - jaxlib==0.4.23
      - numpyro==0.15.0
      - numpy==1.26.4
      - scipy==1.11.4

      # --- runtime support ---
      - pandas==2.1.4
      - matplotlib==3.10.9
      - dill==0.4.1
      - multipledispatch==1.0.0
      - opt-einsum==3.4.0
      - tqdm==4.67.3
      - importlib-resources
      - packaging
      - pyparsing
      - six

      # --- notebook / plotting extras ---
      - contextily==1.7.0
      - rasterio==1.4.4
      - matplotlib-scalebar>=0.8
      - seaborn>=0.11

      # --- gates and dev tooling ---
      # pytest runs the suite. ruff is NOT part of the runtime pins and is not
      # on PATH: invoke it as `python -m ruff check <paths>`.
      - pytest==9.1.1
      - ruff==0.15.21
      - PyYAML==6.0.3
